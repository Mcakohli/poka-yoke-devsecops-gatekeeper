name: Poka-Yoke CI/CD Gatekeeper

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main", "staging" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-quality-and-tests:
    name: Backend Linting & Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.1.7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.1.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Black Code Formatter Check
        run: |
          black --check backend/

      - name: Run Flake8 Code Linter
        run: |
          flake8 backend/ --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 backend/ --count --max-line-length=88 --statistics

      - name: Run Pytest Unit Tests
        run: |
          pytest backend/tests/ -v

  security-and-vulnerability-scan:
    name: DevSecOps Security Gatekeeper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.1.7
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5.1.0
        with:
          python-version: "3.11"

      - name: Run Bandit AST Static Security Analysis
        run: |
          pip install bandit
          bandit -r backend/ -ll -ii

      - name: Run TruffleHog Secret Leak Detection
        uses: trufflesecurity/trufflehog@v3.82.6
        with:
          path: ./
          base: ""
          head: HEAD
          extra_args: --only-verified

      - name: Run Trivy Repository Vulnerability Scanner
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: "fs"
          ignore-unfixed: true
          format: "table"
          severity: "CRITICAL,HIGH"

  terraform-iac-gatekeeper:
    name: Terraform Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4.1.7

      - name: Setup Terraform CLI
        uses: hashicorp/setup-terraform@v3.1.1
        with:
          terraform_version: "1.7.0"

      - name: Terraform Format Check
        run: |
          cd infrastructure/terraform
          terraform fmt -check

      - name: Terraform Init & Validate
        run: |
          cd infrastructure/terraform
          terraform init -backend=false
          terraform validate
